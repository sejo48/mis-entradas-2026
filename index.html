<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Control de Ingresos</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe3ec;--primary:#2563eb}body.dark{color-scheme:dark;--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#cbd5e1;--border:#475569;--primary:#60a5fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);padding:16px 12px 50px}main{max-width:1180px;margin:auto}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0}p{margin:6px 0}.card{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #0000000a}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.stat{padding:12px;border-radius:12px;background:var(--bg)}.stat strong{display:block;font-size:20px;overflow-wrap:anywhere}.green{color:#059669}.orange{color:#d97706}.wide{grid-column:1/-1}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;font-weight:650}button.primary{background:#2563eb;color:white}button.soft{background:var(--bg);color:var(--text);border:1px solid var(--border)}button.danger{color:#be123c;background:var(--bg)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.row{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--border)}.row:first-child{border-top:0}.info{flex:1;min-width:0}.info strong{display:block;overflow-wrap:anywhere}.amount{font-weight:700;white-space:nowrap}.mini{font-size:12px;padding:8px}.check{width:23px;height:23px;accent-color:#059669;flex-shrink:0}.sectionstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 12px}.sectionstat{background:var(--bg);border-radius:10px;padding:9px 7px;min-width:0}.sectionstat span{display:block;font-size:11px;color:var(--muted)}.sectionstat strong{display:block;font-size:clamp(12px,3.4vw,16px);overflow-wrap:anywhere;margin-top:4px}.togglelist{width:100%;margin:5px 0 9px;text-align:left;display:flex;justify-content:space-between;align-items:center;background:var(--bg);color:var(--text);border:1px solid var(--border)}.togglelist:focus-visible{outline:3px solid var(--primary)}.listwrap[hidden]{display:none}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.field{display:block;width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;margin:6px 0 13px;font-size:16px}label{font-size:14px;font-weight:600}dialog{border:0;border-radius:18px;background:var(--card);color:var(--text);width:min(94vw,430px);padding:20px}dialog::backdrop{background:#0009}.empty{text-align:center;color:var(--muted);padding:14px;font-size:14px}.month{display:flex;gap:8px;align-items:center;margin-top:14px}.month input{flex:1;min-width:0;margin:0}small{font-size:12px}#notice{font-size:12px;color:var(--muted);margin-top:12px}input[type=file]{display:none}
@media(min-width:800px){body{padding:28px 28px 60px}.card{padding:22px}header.card{padding:26px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stats .wide{grid-column:auto}.stat{padding:20px}.stat strong{font-size:clamp(21px,2.4vw,32px)}#sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}#sections>.card{margin:0}#sections>.card:last-child:nth-child(odd){grid-column:1/-1}.sectionstat strong{font-size:17px}.actions button{flex:0 1 auto;min-width:170px}.row{gap:14px}}@media(max-width:440px){body{padding:10px 9px 35px}.card{padding:13px}.row{gap:6px;flex-wrap:wrap}.row .info{flex-basis:42%}.row .amount{font-size:13px}.row button{padding:8px 7px}.sectionstat strong{font-size:12px}.actions button{min-width:calc(50% - 4px);font-size:13px}.stat strong{font-size:18px}}@media(min-width:800px) and (max-width:1000px){.row{flex-wrap:wrap}.row .info{flex-basis:50%}}
</style></head><body><main><header class="card"><div class="top"><div><h1>Control de Ingresos</h1><p class="muted">Registro personal de cobros · Versión 3.3 · Móvil y PC</p></div><button class="soft" id="theme" aria-label="Cambiar modo oscuro">🌙</button></div><div class="month"><label for="month">Mes:</label><input class="field" type="month" id="month"></div><div class="stats" id="summary"><div class="stat"><span class="muted">Cobrado</span><strong class="green" id="collected">₡0</strong></div><div class="stat"><span class="muted">Pendiente</span><strong class="orange" id="pending">₡0</strong></div><div class="stat wide"><span class="muted">Total del mes</span><strong id="expected">₡0</strong></div></div><div class="actions"><button class="primary" id="masterMode">Administrar registros fijos</button><button class="soft" id="newMonth">Preparar mes siguiente</button><button class="soft" id="export">Guardar respaldo</button><button class="soft" id="import">Restaurar respaldo</button><input type="file" id="file" accept="application/json,.json"></div><div id="masterHelp" class="muted" style="margin-top:12px"></div><div id="notice">Los datos quedan guardados en este dispositivo. Haz respaldos periódicos.</div></header><div id="sections"></div></main><dialog id="editor"><form id="editForm"><h2 id="editorTitle">Nuevo registro</h2><p><label for="name">Nombre o concepto</label><input id="name" class="field" maxlength="100" required placeholder="Ejemplo: Juan Pérez"></p><p><label for="amount">Monto en colones (₡)</label><input id="amount" class="field" type="number" min="1" step="0.01" inputmode="decimal" required placeholder="Ejemplo: 40000"></p><div class="actions"><button type="button" class="soft" id="cancel">Cancelar</button><button type="submit" class="primary">Guardar</button></div></form></dialog><script>
(()=>{'use strict';
const KEY='control_ingresos_v3',PREV='control_ingresos_v2',OLD='cobros_app',cats=[['transporte','🚐 Transporte'],['alquileres','🏠 Alquileres'],['otros','💰 Otros ingresos']];
const $=id=>document.getElementById(id),now=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')},money=n=>'₡'+Number(n||0).toLocaleString('es-CR',{maximumFractionDigits:2}),blank=()=>({transporte:[],alquileres:[],otros:[]}),validMonth=m=>/^\d{4}-(0[1-9]|1[0-2])$/.test(m),uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function clean(x){const r=blank();for(const s of Object.keys(r))if(Array.isArray(x?.[s]))r[s]=x[s].filter(i=>i&&typeof i.nombre==='string'&&Number(i.monto)>0&&Number.isFinite(Number(i.monto))).slice(0,10000).map(i=>({id:String(i.id||uid()),nombre:i.nombre.slice(0,100),monto:Number(i.monto),pagado:s==='otros'?true:!!i.pagado}));return r}
let db={version:3,theme:'light',master:{transporte:[],alquileres:[]},months:{}};
try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw?.version===3){db.theme=raw.theme==='dark'?'dark':'light';for(const [m,v] of Object.entries(raw.months||{}))if(validMonth(m))db.months[m]=clean(v);for(const s of ['transporte','alquileres'])db.master[s]=clean({[s]:raw.master?.[s]})[s].map(i=>({...i,pagado:false}));}else{const old=JSON.parse(localStorage.getItem(PREV));if(old?.months){db.theme=old.theme==='dark'?'dark':'light';for(const [m,v] of Object.entries(old.months))if(validMonth(m))db.months[m]=clean(v)}else{const legacy=JSON.parse(localStorage.getItem(OLD));if(legacy)db.months[now()]=clean(legacy)}const latest=Object.keys(db.months).sort().at(-1);if(latest)for(const s of ['transporte','alquileres'])db.master[s]=db.months[latest][s].map(i=>({...i,pagado:false}));}
}catch(e){alert('No se pudo leer la información anterior. No se eliminará automáticamente.');}
let month=now(),edit=null,manage=false;const expanded={transporte:false,alquileres:false,otros:false};const current=()=>db.months[month]||(db.months[month]=blank());
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('No se pudo guardar. Crea un respaldo y comprueba el espacio disponible.');return false}}
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){const data=current();$('month').value=month;document.body.classList.toggle('dark',db.theme==='dark');$('theme').textContent=db.theme==='dark'?'☀️':'🌙';$('masterMode').textContent=manage?'Volver a cobros':'Administrar registros fijos';$('masterHelp').textContent=manage?'Aquí editas la lista permanente. Los cambios de nombre y monto se aplican al mes actual y a los meses futuros; los meses anteriores conservan su historial.':'Los nombres y montos de Transporte y Alquileres se conservan al cambiar de mes.';
let total=0,paid=0;const holder=$('sections');holder.replaceChildren();for(const [s,label] of cats){const list=manage&&s!=='otros'?db.master[s]:data[s],sum=list.reduce((a,i)=>a+i.monto,0),got=manage?0:list.reduce((a,i)=>a+(i.pagado?i.monto:0),0);if(!manage){total+=sum;paid+=got}if(manage&&s==='otros')continue;
const card=node('section','card'),head=node('div','sectionhead'),titles=node('div'),h=node('h2','',label),sub=node('div','muted',manage?'Registros permanentes: '+list.length:`Cobrado: ${money(got)} / ${money(sum)}`);titles.append(h,sub);const add=node('button','primary','+ Agregar');add.onclick=()=>openEditor(s);head.append(titles,add);card.append(head);
if(!manage){const metrics=node('div','sectionstats');for(const [caption,value,cls] of [['Cobrado',got,'green'],['Pendiente',sum-got,'orange'],['Esperado',sum,'']]){const metric=node('div','sectionstat'),cap=node('span','',caption),val=node('strong',cls,money(value));metric.append(cap,val);metrics.append(metric)}card.append(metrics)}
const toggle=node('button','togglelist soft',`📋 ${manage?'Registros permanentes':'Ver lista'} (${list.length})  ${expanded[s]?'▲ Ocultar':'▼ Mostrar'}`);toggle.type='button';toggle.setAttribute('aria-expanded',String(expanded[s]));toggle.onclick=()=>{expanded[s]=!expanded[s];render()};card.append(toggle);const listwrap=node('div','listwrap');listwrap.hidden=!expanded[s];if(!list.length)listwrap.append(node('div','empty',manage?'No hay registros permanentes':'Sin registros este mes'));
for(const item of list){const row=node('div','row');if(!manage&&s!=='otros'){const chk=node('input','check');chk.type='checkbox';chk.checked=item.pagado;chk.setAttribute('aria-label','Marcar pago de '+item.nombre);chk.onchange=()=>{item.pagado=chk.checked;save();render()};row.append(chk)}const info=node('div','info'),n=node('strong','',item.nombre),status=node('small',item.pagado?'green':'orange',manage?'Permanente':item.pagado?'Cobrado':'Pendiente');info.append(n,status);const amt=node('span','amount',money(item.monto)),b=node('button','soft mini','Editar');b.onclick=()=>openEditor(s,item.id);const del=node('button','danger mini','✕');del.setAttribute('aria-label','Eliminar '+item.nombre);del.onclick=()=>{if(!confirm(manage?'¿Quitar de la lista permanente? No borrará meses anteriores.':'¿Eliminar este cobro del mes?'))return;const clave=prompt('🔒 Para eliminar este registro, escribe la clave de seguridad:');if(clave===null)return;if(clave.trim().replace(/\s+/g,'')!=='8384'){alert('Clave incorrecta. No se eliminó el registro.');return;}if(manage){db.master[s]=db.master[s].filter(i=>i.id!==item.id);data[s]=data[s].filter(i=>i.id!==item.id)}else data[s]=data[s].filter(i=>i.id!==item.id);save();render()};row.append(info,amt,b,del);listwrap.append(row)}card.append(listwrap);holder.append(card)}$('collected').textContent=money(paid);$('pending').textContent=money(total-paid);$('expected').textContent=money(total);$('summary').hidden=manage;$('newMonth').hidden=manage;}
function openEditor(s,id=null){edit={s,id,permanent:manage&&s!=='otros'};const arr=edit.permanent?db.master[s]:current()[s],item=id?arr.find(i=>i.id===id):null;$('editorTitle').textContent=item?'Editar registro':'Agregar registro';$('name').value=item?.nombre||'';$('amount').value=item?.monto||'';$('editor').showModal();$('name').focus()}
$('editForm').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim(),amount=Number($('amount').value);if(!name||!Number.isFinite(amount)||amount<=0)return alert('Escribe un nombre y un monto válido.');const {s,id,permanent}=edit,arr=permanent?db.master[s]:current()[s];if(id){const i=arr.find(i=>i.id===id);if(i){i.nombre=name;i.monto=amount}if(permanent){const curr=current()[s].find(i=>i.id===id);if(curr){curr.nombre=name;curr.monto=amount}}}else{const item={id:uid(),nombre:name,monto:amount,pagado:s==='otros'};arr.push(item);if(permanent)current()[s].push({...item,pagado:false});else if(s!=='otros'){db.master[s].push({...item,pagado:false})}}if(save()){$('editor').close();render()}};
$('cancel').onclick=()=>$('editor').close();$('month').onchange=e=>{if(validMonth(e.target.value)){month=e.target.value;if(!db.months[month]){const dest=blank();for(const s of ['transporte','alquileres'])dest[s]=db.master[s].map(i=>({...i,pagado:false}));db.months[month]=dest;save()}render()}};
$('theme').onclick=()=>{db.theme=db.theme==='dark'?'light':'dark';save();render()};$('masterMode').onclick=()=>{manage=!manage;render()};
$('newMonth').onclick=()=>{const [y,m]=month.split('-').map(Number),next=new Date(y,m,1),target=next.getFullYear()+'-'+String(next.getMonth()+1).padStart(2,'0');if(db.months[target]){month=target;render();return}if(!confirm('¿Crear '+target+' con los registros permanentes pendientes de pago? El historial anterior se conserva.'))return;const dest=blank();for(const s of ['transporte','alquileres'])dest[s]=db.master[s].map(i=>({...i,pagado:false}));db.months[target]=dest;month=target;save();render()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='respaldo-ingresos-'+now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const raw=JSON.parse(await f.text());if(!raw||![2,3].includes(raw.version)||!raw.months||typeof raw.months!=='object'||Array.isArray(raw.months))throw Error('Formato incorrecto');const months={};for(const [m,v] of Object.entries(raw.months))if(validMonth(m))months[m]=clean(v);if(!Object.keys(months).length)throw Error('Sin meses válidos');const master={transporte:[],alquileres:[]};const latest=Object.keys(months).sort().at(-1);for(const s of ['transporte','alquileres'])master[s]=clean({[s]:raw.version===3?raw.master?.[s]:months[latest][s]})[s].map(i=>({...i,pagado:false}));if(confirm('¿Restaurar respaldo? Reemplazará los registros actuales.')){db={version:3,theme:raw.theme==='dark'?'dark':'light',months,master};month=months[now()]?now():latest;save();render()}}catch(err){alert('Archivo no válido: '+err.message)}e.target.value=''};
if(!localStorage.getItem(KEY))save();render();
})();
</script></body></html>
